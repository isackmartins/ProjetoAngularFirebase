<ion-content [fullscreen]="true">
    <ion-row>
      <ion-col size="4">
        <ion-item>
          <ion-input type="text" label="Nome Completo" [(ngModel)]="usuario.name"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input type="text" label="E-mail" [(ngModel)]="usuario.email"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input type="password" label="Senha" [(ngModel)]="usuario.password"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input type="password" label="Confirmar Senha" [(ngModel)]="usuario.password_confirmation"></ion-input>
        </ion-item>
        <ion-item>
          <ion-button expand="block" (click)="registrar()">Registrar</ion-button>
        </ion-item>
      </ion-col>
    </ion-row>
  </ion-content>
